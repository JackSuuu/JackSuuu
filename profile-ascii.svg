<text x="495" y="183" font-size="14"><tspan fill="#e3b07b">Degree:</tspan><tspan x="586" fill="#a5c9ea">BSc Computer Science · 2023-present</tspan></text>
<text x="495" y="203" font-size="14"><tspan fill="#e3b07b">Focus:</tspan><tspan x="586" fill="#a5c9ea">ML systems / LLM inference</tspan></text>
<text x="495" y="223" font-size="14"><tspan fill="#e3b07b">Research:</tspan><tspan x="586" fill="#a5c9ea">GPU acceleration / CUDA</tspan></text>
<text x="586" y="243" font-size="14" fill="#a5c9ea">Distributed systems / operating systems</text>
