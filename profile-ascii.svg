<text x="495" y="343" font-size="14"><tspan fill="#e3b07b">Web:</tspan><tspan x="586" fill="#a5c9ea">HTML / CSS / React / React Native</tspan></text>
<text x="487" y="383" font-size="14" fill="#c9d1d9">- Frameworks.Tools ──────────────────────</text>
